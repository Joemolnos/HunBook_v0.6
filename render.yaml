services:
  # Backend API (FastAPI via Dockerfile)
  - type: web
    name: hunbook-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REQUIRE_BYOK
        value: "false"
      - key: QUOTA_PER_DAY
        value: "3"
      - key: FRONTEND_ORIGIN
        value: "*"

  # Frontend (Vite static build)
  - type: web
    name: hunbook-frontend
    runtime: static
    plan: free
    autoDeploy: true
    buildCommand: "cd web && npm ci && npm run build"
    staticPublishPath: "web/dist"
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: hunbook-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
